[project]
name = "autonomous-agent-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "asad-naseem-692", email = "asadnaseem692@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "bcrypt==4.0.1",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=3.8.0",
    "openai-agents>=0.22.0",
    "passlib[bcrypt]>=1.7.4",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
autonomous-agent-backend = "autonomous_agent_backend:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]


[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
